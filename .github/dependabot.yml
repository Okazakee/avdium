version: 2
updates:
  # 508 packages are resolved in the lock file. Grouping keeps the noise down
  # while still surfacing every update for review.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Every action in `.github/workflows` is pinned to a commit SHA with a
  # version comment. Dependabot is what keeps those pins current, and it
  # preserves the comment when it bumps the SHA. Without this, the pins would
  # go stale rather than get updated, which is the usual argument against
  # pinning and the reason this entry exists.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
