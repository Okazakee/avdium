# RustSec advisory policy.
#
# 508 packages resolve into the shipped binary, so advisories are worth
# checking. `unmaintained = "workspace"` keeps the report to crates this
# project depends on directly rather than the whole transitive tree, which
# would be noise nobody acts on.
#
# License, ban and source policy is deliberately not configured. Reviewing it
# meant auditing five licenses reached indirectly through egui's bundled fonts,
# arboard's Windows dependencies and the rustls root certificate bundle. That
# is more upkeep than a project this size should carry, and AGENTS.md rule 7
# already covers the obligation that actually matters: reused third-party code
# keeps its original notices.

[advisories]
unmaintained = "workspace"
